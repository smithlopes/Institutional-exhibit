[project]
name = "institutional-exhibit"
version = "0.4.0"
description = "Fixed-layout matplotlib frames and theme for report-ready charts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Smith Lopes", email = "smith.lugia@gmail.com" }]
dependencies = ["matplotlib>=3.7", "numpy", "fonttools>=4.40"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["institutional_exhibit*"]

[tool.setuptools.package-data]
institutional_exhibit = ["fonts/*"]